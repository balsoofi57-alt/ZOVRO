name: ZOVRO Home Native Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-ux-client.js'
      - 'home-ux.css'
      - 'website-final.js'
      - 'scripts/prepare-mobile.js'
      - 'scripts/patch-native.js'
      - '.github/workflows/home-native-preview.yml'

permissions:
  contents: read

jobs:
  ios-preview:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Prepare native web assets
        run: |
          node scripts/prepare-mobile.js
          test -s www/home-ux-client.js
          test -s www/home-ux.css
      - name: Compile unsigned iOS simulator application
        run: |
          set -euo pipefail
          npx --no-install cap add ios
          npx --no-install cap sync ios
          node scripts/patch-native.js
          if [[ -d ios/App/App.xcworkspace ]]; then
            container=(-workspace ios/App/App.xcworkspace)
          else
            container=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${container[@]}" -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/HomePreview CODE_SIGNING_ALLOWED=NO build
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Prepare native web assets
        run: |
          node scripts/prepare-mobile.js
          test -s www/home-ux-client.js
          test -s www/home-ux.css
      - name: Compile Android debug application
        run: |
          set -euo pipefail
          npx --no-install cap add android
          npx --no-install cap sync android
          node scripts/patch-native.js
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
