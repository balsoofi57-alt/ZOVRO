name: ZOVRO Internal Tester Creation Recovery
on:
  push:
    branches: [testflight/five-languages-20261109-3ce7a4c]
    paths: [.github/workflows/zovro-tester-create-recovery.yml]
permissions:
  contents: read
jobs:
  attempt-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install JWT package
        run: python -m pip install --quiet "PyJWT[crypto]==2.10.1"
      - name: Verify app and create internal tester from owner identity once
        env:
          KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          python - <<'PY'
          import base64, datetime, json, os, urllib.error, urllib.parse, urllib.request
          import jwt

          names=("KEY_ID","ISSUER","KEY_B64")
          if not all(os.environ.get(x) for x in names):
              raise SystemExit("Apple API key is not configured")
          now=int(datetime.datetime.now(datetime.timezone.utc).timestamp())
          token=jwt.encode(
              {"iss":os.environ["ISSUER"],"iat":now-30,"exp":now+600,"aud":"appstoreconnect-v1"},
              base64.b64decode(os.environ["KEY_B64"],validate=True),
              algorithm="ES256",headers={"kid":os.environ["KEY_ID"],"typ":"JWT"})

          def api(method,path,params=None,body=None):
              url="https://api.appstoreconnect.apple.com"+path
              if params:
                  url+="?"+urllib.parse.urlencode(params)
              data=None if body is None else json.dumps(body).encode("utf-8")
              request=urllib.request.Request(url,data=data,method=method,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as err:
                  try: issues=json.load(err).get("errors",[])
                  except Exception: issues=[]
                  print("APPLE_HTTP="+str(err.code))
                  print("APPLE_ERRORS="+str([
                      (x.get("code"),str(x.get("detail",""))[:120]) for x in issues
                  ]))
                  return err.code, {}

          def get(path,params=None):
              status,payload=api("GET",path,params)
              if status!=200:
                  raise SystemExit("GET_FAILED_"+str(status))
              return payload.get("data",[])
          apps=get("/v1/apps",{"filter[bundleId]":"com.zovro.app","limit":"5"})
          apps=[x for x in apps if x.get("attributes",{}).get("bundleId")=="com.zovro.app"]
          if len(apps)!=1:
              raise SystemExit("ZOVRO_APP_IDENTITY_NOT_UNIQUE")
          app=apps[0]["id"]
          builds=get("/v1/builds",{"filter[app]":app,"filter[version]":"1.1","limit":"20"})
          builds=[x for x in builds if x.get("attributes",{}).get("processingState")=="VALID"]
          if len(builds)!=1:
              raise SystemExit("VALID_BUILD_NOT_UNIQUE")
          status,payload=api("GET","/v1/builds/"+builds[0]["id"]+"/buildBetaDetail")
          if status!=200 or payload["data"]["attributes"]["internalBuildState"]!="READY_FOR_BETA_TESTING":
              raise SystemExit("BUILD_NOT_READY_FOR_INTERNAL_TESTING")
          groups=get("/v1/betaGroups",{"filter[app]":app,"limit":"100"})
          groups=[x for x in groups if x.get("attributes",{}).get("isInternalGroup") is True]
          if len(groups)!=1:
              raise SystemExit("INTERNAL_GROUP_NOT_UNIQUE")
          group=groups[0]["id"]
          users=get("/v1/users",{"limit":"200"})
          owner=[x for x in users if "ACCOUNT_HOLDER" in x.get("attributes",{}).get("roles",[])]
          if len(owner)!=1 or owner[0].get("attributes",{}).get("allAppsVisible") is not True:
              raise SystemExit("ACCOUNT_HOLDER_MISSING_OR_NOT_AUTHORIZED")
          owner_attrs=owner[0]["attributes"]
          email=owner_attrs.get("username")
          if not email or "@" not in email:
              raise SystemExit("OWNER_EMAIL_NOT_FOUND")
          group_members=get("/v1/betaGroups/"+group+"/betaTesters",{"limit":"200"})
          if any(x.get("attributes",{}).get("email","").lower()==email.lower() for x in group_members):
              print("STATUS=ALREADY_TESTER_IN_INTERNAL_GROUP")
              raise SystemExit(0)
          existing=get("/v1/betaTesters",{"filter[email]":email,"limit":"20"})
          same=[x for x in existing if x.get("attributes",{}).get("email","").lower()==email.lower()]
          if len(same)>1:
              raise SystemExit("AMBIGUOUS_EXISTING_TESTERS")
          if same:
              tester_apps=get("/v1/betaTesters/"+same[0]["id"]+"/apps",{"limit":"200"})
              if any(x.get("id")==app for x in tester_apps):
                  print("STATUS=ALREADY_APP_TESTER")
                  raise SystemExit(0)
          attrs={"email":email}
          for field in ("firstName","lastName"):
              if owner_attrs.get(field):
                  attrs[field]=owner_attrs[field]
          print("EXISTING_MATCHING_TESTER="+str(len(same)))
          data={
              "data":{
                  "type":"betaTesters",
                  "attributes":attrs,
                  "relationships":{
                      "betaGroups":{"data":[{"type":"betaGroups","id":group}]}
                  }
              }
          }
          status,response=api("POST","/v1/betaTesters",body=data)
          print("CREATE_INTERNAL_TESTER_HTTP="+str(status))
          if status==201 and response.get("data",{}).get("type")=="betaTesters":
              print("STATUS=INTERNAL_TESTER_CREATE_ACCEPTED")
          elif status in (409,422):
              print("STATUS=APPLE_REFUSED_TESTER_CREATION")
          else:
              print("STATUS=NOT_VERIFIED")
          verify=get("/v1/betaGroups/"+group+"/betaTesters",{"limit":"200"})
          print("TESTER_IN_ZOVRO_INTERNAL_GROUP="+str(any(
              x.get("attributes",{}).get("email","").lower()==email.lower() for x in verify)))
          print("INTERNAL_TESTER_COUNT="+str(len(verify)))
          PY
