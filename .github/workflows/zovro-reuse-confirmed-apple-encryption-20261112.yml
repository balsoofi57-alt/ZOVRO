name: ZOVRO Restore Previously Accepted Export Compliance (351.1)
on:
  push:
    branches: [release/testflight-android-20261112]
    paths: ['.github/workflows/zovro-reuse-confirmed-apple-encryption-20261112.yml']
permissions:
  contents: read
jobs:
  reuse-established-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install Apple API JWT
        run: python -m pip install --quiet --disable-pip-version-check "PyJWT[crypto]==2.10.1"
      - name: Reapply prior verified declaration only to build 351.1
        env:
          APPLE_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64,datetime,json,urllib.parse,urllib.request,sys
          import jwt
          for name in ("APPLE_KEY_ID","APPLE_ISSUER_ID","APPLE_PRIVATE_KEY_BASE64"):
              if not os.getenv(name): sys.exit("Missing Apple API credential; no change made")
          now=int(datetime.datetime.now(datetime.timezone.utc).timestamp())
          token=jwt.encode({"iss":os.environ["APPLE_ISSUER_ID"],"iat":now-30,"exp":now+600,"aud":"appstoreconnect-v1"},base64.b64decode(os.environ["APPLE_PRIVATE_KEY_BASE64"],validate=True),algorithm="ES256",headers={"kid":os.environ["APPLE_KEY_ID"],"typ":"JWT"})
          def req(method,path,params=None,payload=None):
              url="https://api.appstoreconnect.apple.com"+path
              if params: url+="?"+urllib.parse.urlencode(params)
              data=json.dumps(payload,separators=(',',':')).encode() if payload is not None else None
              headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
              if data is not None: headers["Content-Type"]="application/json"
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method=method,data=data),timeout=40) as response:
                  return json.load(response)
          apps=req("GET","/v1/apps",{"filter[bundleId]":"com.zovro.app","limit":"5"}).get("data",[])
          apps=[a for a in apps if a.get("attributes",{}).get("bundleId")=="com.zovro.app"]
          if len(apps)!=1: sys.exit("Expected one ZOVRO app; no change made")
          builds=req("GET","/v1/builds",{"filter[app]":apps[0]["id"],"sort":"-uploadedDate","limit":"50"}).get("data",[])
          def named(version):
              x=[b for b in builds if b.get("attributes",{}).get("version")==version]
              if len(x)!=1: sys.exit("Expected one build "+version+"; no change made")
              return x[0]
          prior=named("343.1")
          target=named("351.1")
          pa=prior["attributes"];ta=target["attributes"]
          if pa.get("usesNonExemptEncryption") is not False: sys.exit("Prior build is not confirmed exempt; no change made")
          if pa.get("processingState")!="VALID" or ta.get("processingState")!="VALID": sys.exit("Build not valid; no change made")
          if ta.get("usesNonExemptEncryption") is False:
              print("ALREADY_MATCHES_PRIOR_DECLARATION=true")
          elif ta.get("usesNonExemptEncryption") is None:
              payload={"data":{"type":"builds","id":target["id"],"attributes":{"usesNonExemptEncryption":False}}}
              req("PATCH","/v1/builds/"+target["id"],payload=payload)
              print("RESTORED_PREVIOUSLY_APPROVED_ENCRYPTION_VALUE=false")
          else: sys.exit("Build already has a different declaration; no change made")
          recheck=req("GET","/v1/builds/"+target["id"]).get("data",{}).get("attributes",{})
          if recheck.get("usesNonExemptEncryption") is not False: sys.exit("Apple did not confirm expected declaration")
          print("APPLE_CONFIRMED_BUILD=351.1")
          print("APPLE_CONFIRMED_NON_EXEMPT_ENCRYPTION=false")
          detail=req("GET","/v1/builds/"+target["id"]+"/buildBetaDetail").get("data",{}).get("attributes",{})
          print("INTERNAL_BUILD_STATE="+str(detail.get("internalBuildState","UNKNOWN")))
          PY
