name: ZOVRO iOS Release Verification

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the signed IPA to App Store Connect for TestFlight processing
        required: false
        default: false
        type: boolean
  push:
    branches: [main, store-release-prep, zovro-final-deploy]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'src/**'
      - 'package-lock.json'
      - 'assets/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require credentials for requested store upload
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          ZOVRO_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.ZOVRO_IOS_CERTIFICATE_P12_BASE64 }}
          ZOVRO_IOS_CERTIFICATE_PASSWORD: ${{ secrets.ZOVRO_IOS_CERTIFICATE_PASSWORD }}
          ZOVRO_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 }}
          ZOVRO_APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          ZOVRO_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          ZOVRO_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ZOVRO_IOS_CERTIFICATE_P12_BASE64 ZOVRO_IOS_CERTIFICATE_PASSWORD ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 ZOVRO_APPLE_TEAM_ID ZOVRO_APP_STORE_CONNECT_API_KEY_ID ZOVRO_APP_STORE_CONNECT_ISSUER_ID ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required store-upload credential is missing: $name"
              missing=1
            fi
          done
          if [[ "$missing" != 0 ]]; then exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require supported Xcode for App Store submission
        run: |
          set -euo pipefail
          XCODE_INFO=$(xcodebuild -version)
          printf '%s\n' "$XCODE_INFO"
          XCODE_VERSION=$(printf '%s\n' "$XCODE_INFO" | awk '/^Xcode /{print $2}' | head -n 1)
          XCODE_MAJOR=${XCODE_VERSION%%.*}
          if [[ -z "$XCODE_MAJOR" || "$XCODE_MAJOR" -lt 26 ]]; then
            echo "::error::ZOVRO App Store builds require Xcode 26 or later; found Xcode $XCODE_VERSION."
            exit 1
          fi
          echo "Using supported Xcode $XCODE_VERSION."
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare current mobile bundle
        env:
          ZOVRO_API_URL: https://zovro-api-final.onrender.com
          ZOVRO_BUILD_CHANNEL: release
        run: node scripts/prepare-mobile.js
      - name: Create and sync iOS
        run: |
          npx cap add ios
          npx cap sync ios
          node scripts/patch-native.js
      - name: Build unsigned simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name 'App.app' | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ZOVRO-iOS-Simulator-Release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zovro-ios-simulator-unsigned
          retention-days: 14
          if-no-files-found: error
          path: ZOVRO-iOS-Simulator-Release.zip
      - name: Prepare optional App Store signing
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.ZOVRO_IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.ZOVRO_IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$IOS_CERTIFICATE_P12_BASE64" || -z "$IOS_CERTIFICATE_PASSWORD" || -z "$IOS_PROVISIONING_PROFILE_BASE64" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Apple signing secrets are incomplete; keeping the verified unsigned simulator artifact."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/zovro-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/zovro-app-store.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/zovro-app-store.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/zovro-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST_PATH")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST_PATH")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST_PATH")
          PROFILE_APS_ENV=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST_PATH" 2>/dev/null || true)
          if [[ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::The provisioning profile team does not match ZOVRO_APPLE_TEAM_ID."
            exit 1
          fi
          EXPECTED_PROFILE_APP_ID="$APPLE_TEAM_ID.com.zovro.app"
          if [[ "$PROFILE_APP_ID" != "$EXPECTED_PROFILE_APP_ID" ]]; then
            echo "::error::The provisioning profile application identifier does not exactly match $EXPECTED_PROFILE_APP_ID."
            exit 1
          fi
          if [[ "$PROFILE_APS_ENV" != "production" ]]; then
            echo "::error::The provisioning profile does not authorize production APNs (aps-environment=production)."
            exit 1
          fi
          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_INSTALL_DIR"
          cp "$PROFILE_PATH" "$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          {
            echo "available=true"
            echo "profile_uuid=$PROFILE_UUID"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ZOVRO_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "ZOVRO_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "ZOVRO_PROFILE_PATH=$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          } >> "$GITHUB_ENV"
      - name: Configure signing for App target only
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          gem install xcodeproj --version 1.27.0 --no-document --user-install
          export GEM_PATH="$(ruby -e 'print Gem.user_dir'):$(ruby -e 'print Gem.path.join(":")')"
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'ios/App/App.xcodeproj'
          abort "Missing Xcode project: #{project_path}" unless File.directory?(project_path)
          team_id = ENV.fetch('APPLE_TEAM_ID')
          profile_uuid = ENV.fetch('PROFILE_UUID')
          keychain_path = ENV.fetch('ZOVRO_KEYCHAIN_PATH')
          abort 'APPLE_TEAM_ID is empty' if team_id.strip.empty?
          abort 'PROFILE_UUID is empty' if profile_uuid.strip.empty?
          abort 'Signing keychain is missing' unless File.file?(keychain_path)
          project = Xcodeproj::Project.open(project_path)
          app_targets = project.targets.select do |target|
            target.name == 'App' && target.product_type == 'com.apple.product-type.application'
          end
          abort 'Expected exactly one application target named App' unless app_targets.length == 1
          target = app_targets.first
          release_configs = target.build_configurations.select { |config| config.name == 'Release' }
          abort 'App target has no Release configuration' if release_configs.empty?
          release_configs.each do |config|
            settings = config.build_settings
            signing_keys = %w[DEVELOPMENT_TEAM CODE_SIGN_STYLE CODE_SIGN_IDENTITY PROVISIONING_PROFILE PROVISIONING_PROFILE_SPECIFIER OTHER_CODE_SIGN_FLAGS CODE_SIGNING_ALLOWED CODE_SIGNING_REQUIRED]
            settings.keys.each do |key|
              settings.delete(key) if signing_keys.any? { |base| key == base || key.start_with?("#{base}[") }
            end
            settings['DEVELOPMENT_TEAM'] = team_id
            settings['CODE_SIGN_STYLE'] = 'Manual'
            settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = profile_uuid
            settings['CODE_SIGNING_ALLOWED[sdk=iphoneos*]'] = 'YES'
            settings['CODE_SIGNING_REQUIRED[sdk=iphoneos*]'] = 'YES'
            settings['OTHER_CODE_SIGN_FLAGS[sdk=iphoneos*]'] = "$(inherited) --keychain \"#{keychain_path}\""
            settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.zovro.app'
            settings['MARKETING_VERSION'] = '1.0.0'
            settings['CURRENT_PROJECT_VERSION'] = "#{ENV.fetch('GITHUB_RUN_NUMBER')}.#{ENV.fetch('GITHUB_RUN_ATTEMPT')}"
          end
          attributes = project.root_object.attributes
          attributes['TargetAttributes'] ||= {}
          attributes['TargetAttributes'][target.uuid] ||= {}
          attributes['TargetAttributes'][target.uuid]['DevelopmentTeam'] = team_id
          attributes['TargetAttributes'][target.uuid]['ProvisioningStyle'] = 'Manual'
          project.save
          puts 'Configured Release signing for application target App only.'
          RUBY
      - name: Archive signed App Store build
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZOVRO.xcarchive \
            -resultBundlePath build/ZOVRO-Archive.xcresult \
            archive 2>&1 | tee build/ZOVRO-Archive.log
          codesign --verify --deep --strict build/ZOVRO.xcarchive/Products/Applications/App.app
      - name: Upload iOS archive diagnostics
        if: always() && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zovro-ios-archive-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ZOVRO-Archive.log
            build/ZOVRO-Archive.xcresult
      - name: Export signed IPA
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zovro.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/ZOVRO.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
          IPA_PATH=$(find build/export -type f -name '*.ipa' | head -n 1)
          test -n "$IPA_PATH"
          shasum -a 256 "$IPA_PATH" | tee ZOVRO-iOS-Release.sha256
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: zovro-ios-app-store-signed
          retention-days: 14
          if-no-files-found: error
          path: |
            build/export/*.ipa
            ZOVRO-iOS-Release.sha256
      - name: Upload signed IPA to TestFlight
        if: steps.signing.outputs.available == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_STORE_CONNECT_API_KEY_ID" || -z "$APP_STORE_CONNECT_ISSUER_ID" || -z "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" ]]; then
            echo "::error::TestFlight upload was requested, but the App Store Connect API secrets are incomplete."
            exit 1
          fi
          IPA_PATH=$(find build/export -type f -name '*.ipa' | head -n 1)
          test -n "$IPA_PATH"
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          mkdir -p "$API_KEY_DIR"
          cleanup_api_key() {
            rm -f "$API_KEY_PATH"
            rmdir "$API_KEY_DIR" 2>/dev/null || true
          }
          trap cleanup_api_key EXIT
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          xcrun altool \
            --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/zovro-signing.keychain-db" 2>/dev/null || true
          if [[ -n "${ZOVRO_PROFILE_PATH:-}" ]]; then
            rm -f "$ZOVRO_PROFILE_PATH"
          fi
          rm -f "$RUNNER_TEMP/zovro-distribution.p12"
          rm -f "$RUNNER_TEMP/zovro-app-store.mobileprovision"
          rm -f "$RUNNER_TEMP/zovro-app-store.plist"
