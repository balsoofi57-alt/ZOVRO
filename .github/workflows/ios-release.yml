name: ZOVRO iOS Release Verification

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the signed IPA to App Store Connect for TestFlight processing
        required: false
        default: false
        type: boolean

  push:
    branches: [main, store-release-prep, zovro-final-deploy]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: read

concurrency:
  group: zovro-ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require credentials for requested store upload
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          ZOVRO_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.ZOVRO_IOS_CERTIFICATE_P12_BASE64 }}
          ZOVRO_IOS_CERTIFICATE_PASSWORD: ${{ secrets.ZOVRO_IOS_CERTIFICATE_PASSWORD }}
          ZOVRO_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 }}
          ZOVRO_APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          ZOVRO_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          ZOVRO_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for name in \
            ZOVRO_IOS_CERTIFICATE_P12_BASE64 \
            ZOVRO_IOS_CERTIFICATE_PASSWORD \
            ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 \
            ZOVRO_APPLE_TEAM_ID \
            ZOVRO_APP_STORE_CONNECT_API_KEY_ID \
            ZOVRO_APP_STORE_CONNECT_ISSUER_ID \
            ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required store-upload credential is missing: $name"
              missing=1
            fi
          done

          if [[ "$missing" != 0 ]]; then exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require supported Xcode for App Store submission
        run: |
          set -euo pipefail

          XCODE_INFO=$(xcodebuild -version)
          printf '%s\n' "$XCODE_INFO"

          XCODE_VERSION=$(
            printf '%s\n' "$XCODE_INFO" |
              awk '/^Xcode / {print $2}'
          )
          XCODE_MAJOR=${XCODE_VERSION%%.*}

          if [[ ! "$XCODE_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the selected Xcode version."
            exit 1
          fi

          if [[ "$XCODE_MAJOR" -lt 26 ]]; then
            echo "::error::This workflow requires Xcode 26 or later."
            exit 1
          fi

          xcodebuild -showsdks

      - name: Install dependencies
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Prepare current mobile bundle
        env:
          ZOVRO_API_URL: https://zovro-api-final.onrender.com
          ZOVRO_BUILD_CHANNEL: release
        run: |
          set -euo pipefail
          node scripts/prepare-mobile.js

      - name: Create and sync iOS
        run: |
          set -euo pipefail

          if [[ ! -d ios/App/App.xcodeproj ]]; then
            npx --no-install cap add ios
          fi

          npx --no-install cap sync ios
          node scripts/patch-native.js

          test -d ios/App/App.xcodeproj

      - name: Resolve iOS build container
        id: ios_container
        run: |
          set -euo pipefail
          mkdir -p build/logs

          if [[ -d ios/App/App.xcworkspace ]]; then
            kind=workspace
            path=ios/App/App.xcworkspace
          elif [[ -d ios/App/App.xcodeproj ]]; then
            if [[ -f ios/App/Podfile ]]; then
              echo "::error::Podfile exists but App.xcworkspace is missing."
              exit 1
            fi

            kind=project
            path=ios/App/App.xcodeproj
          else
            echo "::error::No supported iOS build container was found."
            exit 1
          fi

          {
            echo "kind=$kind"
            echo "path=$path"
          } >> "$GITHUB_OUTPUT"

          xcodebuild "-$kind" "$path" -list \
            2>&1 | tee build/logs/ios-project-list.log

      - name: Build unsigned simulator app
        id: simulator
        env:
          IOS_CONTAINER_KIND: ${{ steps.ios_container.outputs.kind }}
          IOS_CONTAINER_PATH: ${{ steps.ios_container.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p build/logs

          container_args=(
            "-${IOS_CONTAINER_KIND}"
            "$IOS_CONTAINER_PATH"
          )

          xcodebuild \
            "${container_args[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/logs/ios-simulator.log

          APP_PATH="build/SimulatorDerivedData/Build/Products/Release-iphonesimulator/App.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::The expected simulator App.app was not produced."
            exit 1
          fi

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            ZOVRO-iOS-Simulator-Release.zip

      - name: Store unsigned simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: zovro-ios-simulator-unsigned
          path: ZOVRO-iOS-Simulator-Release.zip
          if-no-files-found: error
          retention-days: 14

      - name: Prepare optional App Store signing
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.ZOVRO_IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.ZOVRO_IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077

          for name in \
            IOS_CERTIFICATE_P12_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Signing credentials are incomplete; keeping the simulator artifact."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          CERTIFICATE_PATH="$RUNNER_TEMP/zovro-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/zovro-app-store.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/zovro-app-store.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/zovro-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "ZOVRO_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security list-keychains -d user \
            > "$RUNNER_TEMP/zovro-original-keychains.txt"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" \
            | /usr/bin/base64 -D > "$CERTIFICATE_PATH"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | /usr/bin/base64 -D > "$PROFILE_PATH"

          test -s "$CERTIFICATE_PATH"
          test -s "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          python3 - "$KEYCHAIN_PATH" <<'PY'
          import os
          import shlex
          import subprocess
          import sys
          from pathlib import Path

          original = (
              Path(os.environ["RUNNER_TEMP"])
              / "zovro-original-keychains.txt"
          )
          paths = shlex.split(original.read_text())
          subprocess.run(
              [
                  "security", "list-keychains", "-d", "user", "-s",
                  sys.argv[1], *paths,
              ],
              check=True,
          )
          PY

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :UUID' "$PROFILE_PLIST_PATH"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST_PATH"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$PROFILE_PLIST_PATH"
          )

          PROFILE_APS_ENV=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:aps-environment' \
              "$PROFILE_PLIST_PATH" 2>/dev/null || true
          )

          if [[ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::Provisioning profile team mismatch."
            exit 1
          fi

          EXPECTED_PROFILE_APP_ID="$APPLE_TEAM_ID.com.zovro.app"

          if [[ "$PROFILE_APP_ID" != "$EXPECTED_PROFILE_APP_ID" ]]; then
            echo "::error::Provisioning profile application identifier mismatch."
            exit 1
          fi

          if [[ "$PROFILE_APS_ENV" != "production" ]]; then
            echo "::error::Provisioning profile must authorize production APNs."
            exit 1
          fi

          export PROFILE_PLIST_PATH KEYCHAIN_PATH

          python3 - <<'PY'
          import datetime
          import hashlib
          import os
          import plistlib
          import re
          import subprocess
          from pathlib import Path

          def fail(message):
              raise SystemExit(f"::error::{message}")

          with open(os.environ["PROFILE_PLIST_PATH"], "rb") as handle:
              profile = plistlib.load(handle)

          expiry = profile.get("ExpirationDate")
          if not isinstance(expiry, datetime.datetime):
              fail("Provisioning profile expiration date is missing.")

          if expiry.tzinfo is None:
              expiry = expiry.replace(tzinfo=datetime.timezone.utc)

          if expiry <= datetime.datetime.now(datetime.timezone.utc):
              fail("Provisioning profile has expired.")

          entitlements = profile.get("Entitlements", {})

          if (
              entitlements.get("get-task-allow") is True
              or "ProvisionedDevices" in profile
              or profile.get("ProvisionsAllDevices") is True
          ):
              fail("The profile is not suitable for this App Store workflow.")

          uuid = profile.get("UUID", "")
          if not re.fullmatch(
              r"[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}",
              uuid,
          ):
              fail("Provisioning profile UUID is invalid.")

          result = subprocess.run(
              [
                  "security", "find-identity", "-v", "-p", "codesigning",
                  os.environ["KEYCHAIN_PATH"],
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          identities = set()
          for line in result.stdout.splitlines():
              match = re.match(
                  r'^\s*\d+\)\s+([0-9A-Fa-f]{40})\s+"Apple Distribution[^"]*"',
                  line,
              )
              if match:
                  identities.add(match.group(1).upper())

          profile_certificates = {
              hashlib.sha1(cert).hexdigest().upper()
              for cert in profile.get("DeveloperCertificates", [])
              if isinstance(cert, bytes)
          }

          matches = sorted(identities & profile_certificates)

          if not matches:
              fail(
                  "No valid Apple Distribution identity matches "
                  "the provisioning profile certificates."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"identity_sha1={matches[0]}\n")

          print("Provisioning profile and signing identity checks passed.")
          PY

          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_INSTALL_PATH="$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"

          echo "ZOVRO_PROFILE_PATH=$PROFILE_INSTALL_PATH" >> "$GITHUB_ENV"

          mkdir -p "$PROFILE_INSTALL_DIR"
          cp "$PROFILE_PATH" "$PROFILE_INSTALL_PATH"

          {
            echo "available=true"
            echo "profile_uuid=$PROFILE_UUID"
          } >> "$GITHUB_OUTPUT"

      - name: Install Xcode project editing dependency
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          gem install --user-install xcodeproj \
            --version 1.27.0 \
            --no-document
          ruby -e 'require "xcodeproj"'

      - name: Configure signing on App target only
        id: signing_config
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity_sha1 }}
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require "xcodeproj"

          project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
          apps = project.targets.select do |target|
            target.name == "App" &&
              target.product_type == "com.apple.product-type.application"
          end

          abort "Expected exactly one App application target." unless apps.size == 1

          release = apps.first.build_configurations.select do |config|
            config.name == "Release"
          end

          abort "Expected exactly one App Release configuration." unless release.size == 1

          settings = release.first.build_settings

          settings.keys.grep(
            /\A(?:CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER)(?:\[.*\])?\z/
          ).each { |key| settings.delete(key) }

          settings["PRODUCT_BUNDLE_IDENTIFIER"] = "com.zovro.app"
          settings["DEVELOPMENT_TEAM"] = ENV.fetch("APPLE_TEAM_ID")
          settings["CODE_SIGN_STYLE"] = "Manual"
          settings["CODE_SIGN_IDENTITY"] = ENV.fetch("SIGNING_IDENTITY")
          settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("PROFILE_UUID")

          project.save
          RUBY

      - name: Archive signed App Store build
        id: archive
        if: steps.signing.outputs.available == 'true'
        env:
          IOS_CONTAINER_KIND: ${{ steps.ios_container.outputs.kind }}
          IOS_CONTAINER_PATH: ${{ steps.ios_container.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p build/logs

          : "${ZOVRO_KEYCHAIN_PATH:?Signing keychain path is missing}"

          container_args=(
            "-${IOS_CONTAINER_KIND}"
            "$IOS_CONTAINER_PATH"
          )

          xcodebuild \
            "${container_args[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            -archivePath build/ZOVRO.xcarchive \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            OTHER_CODE_SIGN_FLAGS="--keychain $ZOVRO_KEYCHAIN_PATH" \
            archive 2>&1 | tee build/logs/ios-archive.log

          ARCHIVED_APP="build/ZOVRO.xcarchive/Products/Applications/App.app"
          test -d "$ARCHIVED_APP"

          codesign --verify --deep --strict "$ARCHIVED_APP"

          ACTUAL_BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              "$ARCHIVED_APP/Info.plist"
          )

          if [[ "$ACTUAL_BUNDLE_ID" != "com.zovro.app" ]]; then
            echo "::error::Archived application bundle ID mismatch."
            exit 1
          fi

      - name: Export signed IPA
        id: ipa
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity_sha1 }}
        run: |
          set -euo pipefail
          mkdir -p build/logs

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "signingCertificate": os.environ["SIGNING_IDENTITY"],
              "teamID": os.environ["APPLE_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
              "provisioningProfiles": {
                  "com.zovro.app": os.environ["PROFILE_UUID"],
              },
          }

          with Path("build/ExportOptions.plist").open("wb") as handle:
              plistlib.dump(options, handle)
          PY

          plutil -lint build/ExportOptions.plist

          python3 - <<'PY'
          import os
          import plistlib

          expected = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "signingCertificate": os.environ["SIGNING_IDENTITY"],
              "teamID": os.environ["APPLE_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
              "provisioningProfiles": {
                  "com.zovro.app": os.environ["PROFILE_UUID"],
              },
          }

          with open("build/ExportOptions.plist", "rb") as handle:
              actual = plistlib.load(handle)

          if not isinstance(actual, dict) or set(actual) != set(expected):
              raise SystemExit("::error::Unexpected ExportOptions structure.")

          for key, value in expected.items():
              if type(actual[key]) is not type(value) or actual[key] != value:
                  raise SystemExit(
                      f"::error::Invalid ExportOptions value or type: {key}"
                  )

          print("ExportOptions.plist validation passed.")
          PY

          xcodebuild \
            -exportArchive \
            -archivePath build/ZOVRO.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            2>&1 | tee build/logs/ios-export.log

          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          files = sorted(Path("build/export").glob("*.ipa"))

          if len(files) != 1 or files[0].stat().st_size == 0:
              raise SystemExit(
                  "::error::Expected exactly one non-empty exported IPA."
              )

          ipa = files[0]
          digest = hashlib.sha256()

          with ipa.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)

          Path("ZOVRO-iOS-Release.sha256").write_text(
              f"{digest.hexdigest()}  {ipa.as_posix()}\n"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"path={ipa.as_posix()}\n")
          PY

      - name: Store signed IPA artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zovro-ios-app-store-signed
          path: |
            build/export/*.ipa
            ZOVRO-iOS-Release.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed IPA to TestFlight
        id: testflight
        if: steps.signing.outputs.available == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          for name in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing App Store Connect credential: $name"
              exit 1
            fi
          done

          [[ "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || {
            echo "::error::Invalid API key ID format."
            exit 1
          }

          test -s "$IPA_PATH"
          xcrun --find altool >/dev/null

          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"

          echo "ZOVRO_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

          mkdir -p "$API_KEY_DIR"

          cleanup_api_key() {
            rm -f "$API_KEY_PATH"
            rmdir "$API_KEY_DIR" 2>/dev/null || true
          }
          trap cleanup_api_key EXIT

          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" \
            | /usr/bin/base64 -D > "$API_KEY_PATH"

          chmod 600 "$API_KEY_PATH"
          test -s "$API_KEY_PATH"
          openssl pkey -in "$API_KEY_PATH" -noout >/dev/null

          xcrun altool \
            --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          {
            echo "### TestFlight upload"
            echo ""
            echo "The upload command completed successfully."
            echo "Check App Store Connect for processing status."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose iOS signing failure
        if: ${{ failure() && (steps.signing.outcome == 'failure' || steps.signing_config.outcome == 'failure' || steps.archive.outcome == 'failure' || steps.ipa.outcome == 'failure') }}
        env:
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          CONFIG_OUTCOME: ${{ steps.signing_config.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          EXPORT_OUTCOME: ${{ steps.ipa.outcome }}
        run: |
          set -euo pipefail
          mkdir -p build/logs

          python3 - <<'PY'
          import os
          from pathlib import Path

          findings = [
              f"Signing preparation: {os.environ['SIGNING_OUTCOME']}",
              f"App target configuration: {os.environ['CONFIG_OUTCOME']}",
              f"Archive: {os.environ['ARCHIVE_OUTCOME']}",
              f"Export: {os.environ['EXPORT_OUTCOME']}",
          ]

          patterns = {
              "errsecinternalcomponent":
                  "Review keychain unlocking and private-key access.",
              "no signing certificate":
                  "The required signing identity could not be found.",
              "no profiles for":
                  "A matching provisioning profile could not be found.",
              "requires a provisioning profile":
                  "A target requires a provisioning profile.",
              "doesn't include signing certificate":
                  "The selected certificate may not match the profile.",
              "doesn't support":
                  "Review profile capabilities and target entitlements.",
              "codesign failed":
                  "Xcode reported a CodeSign failure.",
          }

          text = ""
          for filename in ("ios-archive.log", "ios-export.log"):
              path = Path("build/logs") / filename
              if path.is_file():
                  text += path.read_text(errors="replace").casefold()

          for token, message in patterns.items():
              if token in text:
                  findings.append(message)

          report = (
              "### iOS signing/build diagnostics\n\n"
              + "\n".join(f"- {item}" for item in findings)
              + "\n\nThe workflow remains failed. "
                "No signing checks were bypassed.\n"
          )

          Path("build/logs/ios-signing-diagnostics.txt").write_text(report)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(report)
          PY

      - name: Report TestFlight upload failure
        if: ${{ failure() && steps.testflight.outcome == 'failure' }}
        run: |
          {
            echo "### TestFlight upload failed"
            echo ""
            echo "Review the validation/upload step output."
            echo "Check API authorization and package validation."
            echo "No automatic upload retry was performed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import shlex
          import subprocess
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          original = temp / "zovro-original-keychains.txt"

          if original.is_file():
              try:
                  paths = shlex.split(original.read_text())
                  result = subprocess.run(
                      ["security", "list-keychains", "-d", "user", "-s", *paths],
                      capture_output=True,
                      timeout=30,
                  )
                  if result.returncode:
                      print("::warning::Could not restore the keychain search list.")
              except Exception:
                  print("::warning::Could not restore the keychain search list.")

          try:
              subprocess.run(
                  [
                      "security", "delete-keychain",
                      str(temp / "zovro-signing.keychain-db"),
                  ],
                  capture_output=True,
                  timeout=30,
              )
          except Exception:
              print("::warning::Could not remove the temporary keychain.")

          files = [
              temp / "zovro-distribution.p12",
              temp / "zovro-app-store.mobileprovision",
              temp / "zovro-app-store.plist",
              original,
          ]

          for variable in ("ZOVRO_PROFILE_PATH", "ZOVRO_API_KEY_PATH"):
              value = os.environ.get(variable)
              if value:
                  files.append(Path(value))

          for path in files:
              try:
                  path.unlink(missing_ok=True)
              except OSError:
                  print("::warning::A temporary signing file could not be removed.")
          PY

      - name: Upload iOS diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zovro-ios-diagnostic-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7
