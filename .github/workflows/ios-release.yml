name: ZOVRO iOS Release Verification

on:
  workflow_dispatch:
  push:
    branches: [main, store-release-prep]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package-lock.json'
      - 'assets/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare current mobile bundle
        env:
          ZOVRO_API_URL: https://zovro-api-final.onrender.com
          ZOVRO_BUILD_CHANNEL: release
        run: node scripts/prepare-mobile.js

      - name: Create and sync iOS
        run: |
          npx cap add ios
          npx cap sync ios
          node scripts/patch-native.js

      - name: Build unsigned simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name 'App.app' | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ZOVRO-iOS-Simulator-Release.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zovro-ios-simulator-unsigned
          retention-days: 14
          if-no-files-found: error
          path: ZOVRO-iOS-Simulator-Release.zip

      - name: Prepare optional App Store signing
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.ZOVRO_IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.ZOVRO_IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
        run: |
          if [[ -z "$IOS_CERTIFICATE_P12_BASE64" || -z "$IOS_CERTIFICATE_PASSWORD" || -z "$IOS_PROVISIONING_PROFILE_BASE64" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Apple signing secrets are incomplete; keeping the verified unsigned simulator artifact."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/zovro-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/zovro-app-store.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/zovro-app-store.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/zovro-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST_PATH")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST_PATH")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST_PATH")

          if [[ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::The provisioning profile team does not match ZOVRO_APPLE_TEAM_ID."
            exit 1
          fi
          case "$PROFILE_APP_ID" in
            *".com.zovro.app") ;;
            *)
              echo "::error::The provisioning profile does not authorize com.zovro.app."
              exit 1
              ;;
          esac

          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_INSTALL_DIR"
          cp "$PROFILE_PATH" "$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"

          {
            echo "available=true"
            echo "profile_uuid=$PROFILE_UUID"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ZOVRO_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "ZOVRO_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "ZOVRO_PROFILE_PATH=$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          } >> "$GITHUB_ENV"

      - name: Archive signed App Store build
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZOVRO.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.zovro.app \
            OTHER_CODE_SIGN_FLAGS="--keychain $ZOVRO_KEYCHAIN_PATH" \
            archive
          codesign --verify --deep --strict build/ZOVRO.xcarchive/Products/Applications/App.app

      - name: Export signed IPA
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zovro.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/ZOVRO.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

          IPA_PATH=$(find build/export -type f -name '*.ipa' | head -n 1)
          test -n "$IPA_PATH"
          shasum -a 256 "$IPA_PATH" | tee ZOVRO-iOS-Release.sha256

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: zovro-ios-app-store-signed
          retention-days: 14
          if-no-files-found: error
          path: |
            build/export/*.ipa
            ZOVRO-iOS-Release.sha256

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/zovro-signing.keychain-db" 2>/dev/null || true
          if [[ -n "${ZOVRO_PROFILE_PATH:-}" ]]; then
            rm -f "$ZOVRO_PROFILE_PATH"
          fi
          rm -f "$RUNNER_TEMP/zovro-distribution.p12"
          rm -f "$RUNNER_TEMP/zovro-app-store.mobileprovision"
          rm -f "$RUNNER_TEMP/zovro-app-store.plist"
