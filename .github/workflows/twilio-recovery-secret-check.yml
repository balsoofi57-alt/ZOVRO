name: Twilio Recovery Secret Check
on:
  push:
    branches:
      - ops/check-twilio-recovery-secrets-20260926
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Twilio recovery secret presence
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_RECOVERY_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_RECOVERY_VERIFY_SERVICE_SID }}
        run: |
          test -n "$TWILIO_ACCOUNT_SID" && echo "TWILIO_ACCOUNT_SID_PRESENT=true" || echo "TWILIO_ACCOUNT_SID_PRESENT=false"
          test -n "$TWILIO_AUTH_TOKEN" && echo "TWILIO_AUTH_TOKEN_PRESENT=true" || echo "TWILIO_AUTH_TOKEN_PRESENT=false"
          test -n "$TWILIO_RECOVERY_VERIFY_SERVICE_SID" && echo "TWILIO_RECOVERY_VERIFY_SERVICE_SID_PRESENT=true" || echo "TWILIO_RECOVERY_VERIFY_SERVICE_SID_PRESENT=false"
