name: Support Recovery Sender QA
on:
  push:
    branches:
      - feature/password-recovery-email-sender-20260926
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.3'
      - name: Install support mail dependencies
        working-directory: workers/support-mail
        run: npm ci
      - name: Run support mail tests
        working-directory: workers/support-mail
        run: npm test
