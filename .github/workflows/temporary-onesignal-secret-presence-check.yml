name: Temporary OneSignal Secret Presence Check
on:
  push:
    branches: [zovro-final-deploy]
    paths:
      - '.github/workflows/temporary-onesignal-secret-presence-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report OneSignal secret presence only
        env:
          ONE: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONE_ALT: ${{ secrets.ZOVRO_ONESIGNAL_REST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ONE:-}" ]]; then echo "ONESIGNAL_REST_API_KEY=PRESENT"; else echo "ONESIGNAL_REST_API_KEY=MISSING"; fi
          if [[ -n "${ONE_ALT:-}" ]]; then echo "ZOVRO_ONESIGNAL_REST_API_KEY=PRESENT"; else echo "ZOVRO_ONESIGNAL_REST_API_KEY=MISSING"; fi
