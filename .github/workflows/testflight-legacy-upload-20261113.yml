name: ZOVRO TestFlight retry with legacy altool (signed IPA 384)
on:
  push:
    branches:
      - release/testflight-legacy-upload-20261113

permissions:
  contents: read
  actions: read

concurrency:
  group: zovro-testflight-signed-384-retry
  cancel-in-progress: false

jobs:
  upload-signed-build-384:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the already-signed current iPhone IPA from run 384
        uses: actions/download-artifact@v4
        with:
          name: zovro-ios-app-store-signed
          run-id: 43532842071
          repository: balsoofi57-alt/ZOVRO
          github-token: ${{ github.token }}
          path: signed-384

      - name: Verify exact signed artifact checksum and locate IPA
        id: source
        run: |
          set -euo pipefail
          ipa="$(find signed-384 -type f -name '*.ipa' -print -quit)"
          count="$(find signed-384 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          test "$count" = 1 && test -s "$ipa" || { echo "::error::Expected one signed IPA from run 384."; exit 1; }
          check="$(find signed-384 -type f -name 'ZOVRO-iOS-Release.sha256' -print -quit)"
          test -n "$check" && test -s "$check" || { echo "::error::Missing signed build checksum."; exit 1; }
          expected="$(awk 'NR==1{print $1}' "$check")"
          actual="$(shasum -a 256 "$ipa" | awk '{print $1}')"
          test "$expected" = "$actual" || { echo "::error::Signed IPA checksum mismatch."; exit 1; }
          echo "path=$ipa" >> "$GITHUB_OUTPUT"
          echo "Verified exact previously-signed release IPA from run 384."

      - name: Validate and upload the same signed IPA to TestFlight using legacy altool
        env:
          IPA_PATH: ${{ steps.source.outputs.path }}
          ASC_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing Apple credential: $name"; exit 1; fi
          done
          test -s "$IPA_PATH"
          xcrun --find altool >/dev/null
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_file="$key_dir/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$key_dir"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          printf '%s' "$ASC_KEY_BASE64" | /usr/bin/base64 -D > "$key_file"
          chmod 600 "$key_file"
          openssl pkey -in "$key_file" -noout >/dev/null
          echo "Retrying upload with Xcode 26 legacy-altool compatibility mode."
          xcrun altool --use-old-altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --use-old-altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            echo '### TestFlight upload result'
            echo 'Uploaded the exact signed IPA generated by GitHub Actions run 384.'
            echo 'Apple still needs to complete TestFlight processing.'
          } >> "$GITHUB_STEP_SUMMARY"
