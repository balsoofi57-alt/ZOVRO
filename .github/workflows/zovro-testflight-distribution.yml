name: ZOVRO TestFlight Internal Distribution
on:
  push:
    branches:
      - testflight/five-languages-20261109-3ce7a4c
    paths:
      - .github/workflows/zovro-testflight-distribution.yml

permissions:
  contents: read

jobs:
  complete-internal-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install Apple API JWT dependency
        run: python -m pip install --disable-pip-version-check --quiet "PyJWT[crypto]==2.10.1"
      - name: Complete export exemption declaration and link internal group only
        env:
          APPLE_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          python - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import jwt

          for required in ("APPLE_KEY_ID", "APPLE_ISSUER_ID", "APPLE_PRIVATE_KEY_BASE64"):
              if not os.environ.get(required):
                  sys.exit("Missing configured API credential: " + required)
          now = int(dt.datetime.now(dt.timezone.utc).timestamp())
          key = base64.b64decode(os.environ["APPLE_PRIVATE_KEY_BASE64"], validate=True)
          token = jwt.encode(
              {
                  "iss": os.environ["APPLE_ISSUER_ID"], "iat": now - 30,
                  "exp": now + 600, "aud": "appstoreconnect-v1",
              },
              key, algorithm="ES256",
              headers={"kid": os.environ["APPLE_KEY_ID"], "typ": "JWT"},
          )
          root = "https://api.appstoreconnect.apple.com"

          def request(method, path, params=None, body=None):
              url = root + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              payload = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  url, data=payload, method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  print(f"Apple API error: {method} {path} HTTP {error.code}")
                  try:
                      details = json.load(error)
                      print("Error codes:", [
                          x.get("code") for x in details.get("errors", [])
                      ])
                      print("Error details:", [
                          str(x.get("detail", ""))[:250] for x in details.get("errors", [])
                      ])
                  except Exception:
                      pass
                  raise

          apps = request("GET", "/v1/apps",
                         {"filter[bundleId]": "com.zovro.app", "limit": "5"}).get("data", [])
          apps = [x for x in apps if x.get("attributes", {}).get("bundleId") == "com.zovro.app"]
          if len(apps) != 1:
              sys.exit("App identity mismatch")
          app_id = apps[0]["id"]
          builds = []
          for attempt in range(18):
              builds = request("GET", "/v1/builds", {
                  "filter[app]": app_id, "filter[version]": "2.1", "limit": "20"
              }).get("data", [])
              if len(builds) == 1 and builds[0].get("attributes", {}).get("processingState") == "VALID":
                  break
              if len(builds) > 1:
                  sys.exit("Ambiguous matching Build 2.1; no changes made")
              print("APPLE_BUILD_2_1_PROCESSING_ATTEMPT=" + str(attempt + 1), flush=True)
              time.sleep(20)
          if len(builds) != 1:
              sys.exit("Apple has not indexed Build 2.1 yet; no changes made")
          build = builds[0]
          if build.get("attributes", {}).get("processingState") != "VALID":
              sys.exit("Build 2.1 is not processed/VALID; no changes made")
          build_id = build["id"]
          current = build["attributes"].get("usesNonExemptEncryption")
          print("PREVIOUS_NONEXEMPT_FLAG=" + str(current))
          if current is True:
              sys.exit("Build previously marked non-exempt; cannot override existing compliance")
          if current is None:
              request("PATCH", "/v1/builds/" + build_id, body={
                  "data": {
                      "type": "builds",
                      "id": build_id,
                      "attributes": {"usesNonExemptEncryption": False},
                  }
              })
              print("EXPORT_EXEMPTION_DECLARATION=SUBMITTED")
          else:
              print("EXPORT_EXEMPTION_DECLARATION=ALREADY_SET")

          build = request("GET", "/v1/builds/" + build_id)["data"]
          print("NONEXEMPT_FLAG_AFTER=" + str(
              build.get("attributes", {}).get("usesNonExemptEncryption")
          ))
          detail = request("GET", "/v1/builds/" + build_id + "/buildBetaDetail").get("data", {})
          print("INTERNAL_BETA_STATE_AFTER=" + str(
              detail.get("attributes", {}).get("internalBuildState")
          ))

          groups = request("GET", "/v1/betaGroups", {
              "filter[app]": app_id, "limit": "100"
          }).get("data", [])
          internal = [g for g in groups
                      if g.get("attributes", {}).get("isInternalGroup") is True]
          if len(internal) != 1:
              sys.exit("Expected one existing internal group; no group changes made")
          group = internal[0]
          group_id = group["id"]
          linked = request("GET", "/v1/betaGroups/" + group_id + "/builds", {
              "limit": "200"
          }).get("data", [])
          if any(x.get("id") == build_id for x in linked):
              print("BUILD_GROUP_LINK=ALREADY_PRESENT")
          else:
              try:
                  request("POST", "/v1/builds/" + build_id +
                          "/relationships/betaGroups", body={
                              "data": [{"type": "betaGroups", "id": group_id}]
                          })
                  print("BUILD_GROUP_LINK=ADDED")
              except urllib.error.HTTPError as error:
                  if error.code != 422:
                      raise
                  print("BUILD_GROUP_LINK=UNSUPPORTED_OR_REJECTED_422")
          linked = request("GET", "/v1/betaGroups/" + group_id + "/builds", {
              "limit": "200"
          }).get("data", [])
          print("INTERNAL_GROUP_LINK_VERIFIED=" + str(
              any(x.get("id") == build_id for x in linked)
          ))

          testers = request("GET", "/v1/betaGroups/" + group_id +
                            "/betaTesters", {"limit": "200"}).get("data", [])
          print("INTERNAL_TESTERS=" + str(len(testers)))
          try:
              users = request("GET", "/v1/users", {"limit": "200"}).get("data", [])
              eligible_roles = {"ACCOUNT_HOLDER", "ADMIN", "APP_MANAGER",
                                "DEVELOPER", "MARKETING"}
              eligible = [u for u in users if eligible_roles.intersection(
                  set(u.get("attributes", {}).get("roles", []))
              )]
              print("ELIGIBLE_TEAM_USERS=" + str(len(eligible)))
              print("ACCOUNT_HOLDER_COUNT=" + str(sum(
                  "ACCOUNT_HOLDER" in u.get("attributes", {}).get("roles", [])
                  for u in eligible
              )))
          except urllib.error.HTTPError as exc:
              print("TEAM_USERS_STATUS=HTTP_" + str(exc.code))
          PY
