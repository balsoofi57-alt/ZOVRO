name: ZOVRO TestFlight Processing Check
on:
  push:
    branches:
      - testflight/five-languages-20261109-3ce7a4c
    paths:
      - .github/workflows/zovro-testflight-status.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-apple-status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Apple API JWT dependency
        run: python -m pip install --disable-pip-version-check --quiet "PyJWT[crypto]==2.10.1"
      - name: Check uploaded ZOVRO build and internal groups (read only)
        env:
          APPLE_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          python - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          for required in ("APPLE_KEY_ID", "APPLE_ISSUER_ID", "APPLE_PRIVATE_KEY_BASE64"):
              if not os.environ.get(required):
                  sys.exit("Missing configured API credential: " + required)
          now = int(dt.datetime.now(dt.timezone.utc).timestamp())
          private_key = base64.b64decode(os.environ["APPLE_PRIVATE_KEY_BASE64"], validate=True)
          token = jwt.encode(
              {
                  "iss": os.environ["APPLE_ISSUER_ID"],
                  "iat": now - 30,
                  "exp": now + 600,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": os.environ["APPLE_KEY_ID"], "typ": "JWT"},
          )
          root = "https://api.appstoreconnect.apple.com"
          def get(path, params=None):
              url = root + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url, headers={"Authorization": "Bearer " + token, "Accept": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as err:
                  print(f"Apple API request failed: path={path} HTTP={err.code}")
                  raise

          apps = get("/v1/apps", {"filter[bundleId]": "com.zovro.app", "limit": "5"}).get("data", [])
          apps = [item for item in apps if item.get("attributes", {}).get("bundleId") == "com.zovro.app"]
          if len(apps) != 1:
              sys.exit(f"Expected one ZOVRO app, found {len(apps)}")
          app_id = apps[0]["id"]

          builds = get("/v1/builds", {"filter[app]": app_id, "filter[version]": "1.1", "limit": "20"}).get("data", [])
          print("ZOVRO 1.0.0 / build 1.1 status check")
          if not builds:
              print("Build is not visible as a processed build resource yet.")
              print("STATUS=AWAITING_APPLE_PROCESSING_OR_VISIBILITY")
          for item in builds:
              a = item.get("attributes", {})
              print("BUILD_ID=" + str(item["id"]))
              print("PROCESSING_STATE=" + str(a.get("processingState", "UNKNOWN")))
              print("UPLOADED_DATE=" + str(a.get("uploadedDate", "UNKNOWN")))
              print("BUILD_AUDIENCE=" + str(a.get("buildAudienceType", "UNKNOWN")))
              print("EXPIRED=" + str(a.get("expired", "UNKNOWN")))
              if a.get("processingState") == "VALID":
                  print("STATUS=APPLE_PROCESSING_COMPLETE")
              elif a.get("processingState") in ("FAILED", "INVALID"):
                  print("STATUS=APPLE_PROCESSING_REJECTED")
              else:
                  print("STATUS=APPLE_PROCESSING_NOT_FINISHED")

          for item in builds:
              try:
                  detail = get(f"/v1/builds/{item['id']}/buildBetaDetail").get("data", {}).get("attributes", {})
                  print("INTERNAL_BETA_STATE=" + str(detail.get("internalBuildState", "UNKNOWN")))
                  print("EXTERNAL_BETA_STATE=" + str(detail.get("externalBuildState", "UNKNOWN")))
              except urllib.error.HTTPError as err:
                  print("BETA_DETAIL_STATUS=NOT_ACCESSIBLE_HTTP_" + str(err.code))

          try:
              groups = get("/v1/betaGroups", {"filter[app]": app_id, "limit": "100"}).get("data", [])
              internal = [g for g in groups if g.get("attributes", {}).get("isInternalGroup") is True]
              print("INTERNAL_GROUP_COUNT=" + str(len(internal)))
              for item in internal:
                  attrs = item.get("attributes", {})
                  print("INTERNAL_GROUP_ALL_BUILDS=" + str(attrs.get("hasAccessToAllBuilds", False)))
                  testers = get(f"/v1/betaGroups/{item['id']}/betaTesters", {"limit": "200"}).get("data", [])
                  print("INTERNAL_GROUP_TESTER_COUNT=" + str(len(testers)))
                  states = {}
                  for tester in testers:
                      state = str(tester.get("attributes", {}).get("state", "UNKNOWN"))
                      states[state] = states.get(state, 0) + 1
                  print("TESTER_STATES=" + json.dumps(states, sort_keys=True))
                  if builds:
                      linked = get(f"/v1/betaGroups/{item['id']}/builds", {"limit": "200"}).get("data", [])
                      print("BUILD_LINKED_TO_GROUP=" + str(any(
                          x["id"] in {b["id"] for b in builds} for x in linked
                      )))
          except urllib.error.HTTPError as err:
              print("BETA_GROUP_STATUS=NOT_ACCESSIBLE_HTTP_" + str(err.code))
          PY
