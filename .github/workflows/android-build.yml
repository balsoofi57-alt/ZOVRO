name: Build ZOVRO Android

on:
  push:
    branches: [store-release-prep]
    paths:
      - '.github/workflows/android-build.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      upload_google_play:
        description: Upload the signed AAB to the Google Play internal track as a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android native project
        env:
          ZOVRO_API_URL: https://zovro-api-final.onrender.com
          ZOVRO_BUILD_CHANNEL: android-ci
        run: npm run mobile:init
      - name: Assign unique Android release version
        id: version
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          export ZOVRO_VERSION_CODE="$VERSION_CODE"
          perl -0pi -e 's/versionCode\s+\d+/versionCode $ENV{ZOVRO_VERSION_CODE}/' android/app/build.gradle
          perl -0pi -e 's/versionName\s+"[^"]+"/versionName "1.0.0"/' android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+$VERSION_CODE" android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1\.0\.0"' android/app/build.gradle
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          grep -R -q 'com.zovro.app' android/app || true
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Prepare optional Play upload signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZOVRO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/zovro-upload.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Play upload signing secrets are incomplete; producing an unsigned release candidate."
          fi
      - name: Build unsigned release AAB
        if: steps.signing.outputs.available != 'true'
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - name: Build signed release AAB
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          ZOVRO_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ZOVRO_KEYSTORE_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_PASSWORD }}
          ZOVRO_KEY_ALIAS: ${{ secrets.ZOVRO_ANDROID_KEY_ALIAS }}
          ZOVRO_KEY_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            "-Pandroid.injected.signing.store.file=$ZOVRO_KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$ZOVRO_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ZOVRO_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ZOVRO_KEY_PASSWORD"
      - name: Verify signed bundle and record digest
        if: steps.signing.outputs.available == 'true'
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$AAB_PATH"
          jarsigner -verify "$AAB_PATH" | grep -q 'jar verified'
          sha256sum "$AAB_PATH" | tee ZOVRO-Android-Release.sha256
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zovro-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release AAB
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zovro-android-release-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zovro-android-release-signed-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            ZOVRO-Android-Release.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Verify optional Google Play upload authorization
        id: play_upload
        if: steps.signing.outputs.available == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_google_play == true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ZOVRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Google Play upload was requested, but ZOVRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Play Developer API
        id: play_auth
        if: steps.play_upload.outputs.available == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.ZOVRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload signed AAB to Google Play internal draft
        if: steps.play_upload.outputs.available == 'true'
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          AAB_PATH=$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$AAB_PATH"
          test -n "$GOOGLE_PLAY_ACCESS_TOKEN"

          API_ROOT="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.zovro.app"
          UPLOAD_ROOT="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/com.zovro.app"

          EDIT_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GOOGLE_PLAY_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$API_ROOT/edits")
          EDIT_ID=$(printf '%s' "$EDIT_RESPONSE" | jq -r '.id // empty')
          test -n "$EDIT_ID"

          BUNDLE_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --max-time 600 \
            --request POST \
            --header "Authorization: Bearer $GOOGLE_PLAY_ACCESS_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$AAB_PATH" \
            "$UPLOAD_ROOT/edits/$EDIT_ID/bundles?uploadType=media")
          UPLOADED_VERSION_CODE=$(printf '%s' "$BUNDLE_RESPONSE" | jq -r '.versionCode // empty')
          test "$UPLOADED_VERSION_CODE" = "$VERSION_CODE"

          TRACK_PAYLOAD=$(jq -n \
            --arg versionCode "$UPLOADED_VERSION_CODE" \
            --arg releaseName "ZOVRO 1.0.0 internal build $UPLOADED_VERSION_CODE" \
            '{track:"internal",releases:[{name:$releaseName,versionCodes:[$versionCode],status:"draft"}]}')

          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $GOOGLE_PLAY_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$TRACK_PAYLOAD" \
            "$API_ROOT/edits/$EDIT_ID/tracks/internal" >/dev/null

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GOOGLE_PLAY_ACCESS_TOKEN" \
            "$API_ROOT/edits/$EDIT_ID:commit?changesNotSentForReview=true&changesInReviewBehavior=ERROR_IF_IN_REVIEW" >/dev/null

          echo "Google Play internal draft prepared for versionCode $UPLOADED_VERSION_CODE."
