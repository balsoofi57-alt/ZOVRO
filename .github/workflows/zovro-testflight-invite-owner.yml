name: ZOVRO TestFlight Account Holder Invitation
on:
  push:
    branches:
      - testflight/five-languages-20261109-3ce7a4c
    paths:
      - .github/workflows/zovro-testflight-invite-owner.yml

permissions:
  contents: read

jobs:
  invite-account-holder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Apple API JWT dependency
        run: python -m pip install --disable-pip-version-check --quiet "PyJWT[crypto]==2.10.1"
      - name: Invite the existing Apple Account Holder to ZOVRO internal TestFlight only
        env:
          APPLE_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          python - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          for name in ("APPLE_KEY_ID", "APPLE_ISSUER_ID", "APPLE_PRIVATE_KEY_BASE64"):
              if not os.environ.get(name):
                  sys.exit("Configured Apple API credential missing: " + name)
          now = int(dt.datetime.now(dt.timezone.utc).timestamp())
          key = base64.b64decode(os.environ["APPLE_PRIVATE_KEY_BASE64"], validate=True)
          token = jwt.encode(
              {"iss": os.environ["APPLE_ISSUER_ID"], "iat": now - 30,
               "exp": now + 600, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": os.environ["APPLE_KEY_ID"], "typ": "JWT"}
          )
          root = "https://api.appstoreconnect.apple.com"

          def call(method, path, params=None, body=None):
              url = root + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              payload = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  method=method,
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  print("APPLE_REQUEST_FAILED: method=" + method + " path=" + path +
                        " status=" + str(error.code))
                  try:
                      failures = json.load(error).get("errors", [])
                      print("APPLE_ERROR_CODES=" + str([e.get("code") for e in failures]))
                      print("APPLE_ERROR_DETAILS=" + str([
                          str(e.get("detail", ""))[:180]
                          for e in failures
                      ]))
                  except Exception:
                      pass
                  raise

          apps = call("GET", "/v1/apps", {
              "filter[bundleId]": "com.zovro.app", "limit": "5"
          }).get("data", [])
          apps = [
              a for a in apps if a.get("attributes", {}).get("bundleId") == "com.zovro.app"
          ]
          if len(apps) != 1:
              sys.exit("APP_ID_MISMATCH: no invitation")
          app_id = apps[0]["id"]

          builds = call("GET", "/v1/builds", {
              "filter[app]": app_id, "filter[version]": "1.1", "limit": "20"
          }).get("data", [])
          if len(builds) != 1 or builds[0].get("attributes", {}).get("processingState") != "VALID":
              sys.exit("EXPECTED_PROCESSED_BUILD_UNAVAILABLE: no invitation")
          build_id = builds[0]["id"]
          beta_detail = call("GET", "/v1/builds/" + build_id + "/buildBetaDetail")
          if beta_detail.get("data", {}).get("attributes", {}).get("internalBuildState") != "READY_FOR_BETA_TESTING":
              sys.exit("BUILD_NOT_READY_FOR_INTERNAL_TEST: no invitation")

          groups = call("GET", "/v1/betaGroups", {
              "filter[app]": app_id, "limit": "100"
          }).get("data", [])
          internal = [g for g in groups
                      if g.get("attributes", {}).get("isInternalGroup") is True]
          if len(internal) != 1:
              sys.exit("EXPECTED_ONE_INTERNAL_GROUP: no invitation")
          group = internal[0]
          group_id = group["id"]
          print("AUTO_DISTRIBUTE_ALL_BUILDS=" +
                str(group.get("attributes", {}).get("hasAccessToAllBuilds")))

          members = call("GET", "/v1/users", {"limit": "200"}).get("data", [])
          owners = [u for u in members
                    if "ACCOUNT_HOLDER" in u.get("attributes", {}).get("roles", [])]
          if len(owners) != 1:
              sys.exit("ACCOUNT_HOLDER_NOT_UNIQUE: no invitation")
          owner_attrs = owners[0].get("attributes", {})
          email = owner_attrs.get("username")
          if not isinstance(email, str) or "@" not in email:
              sys.exit("ACCOUNT_HOLDER_EMAIL_MISSING: no invitation")

          if owner_attrs.get("allAppsVisible") is False:
              visible = call("GET", "/v1/users/" + owners[0]["id"] + "/visibleApps",
                             {"limit": "200"}).get("data", [])
              if app_id not in {x.get("id") for x in visible}:
                  sys.exit("OWNER_NOT_AUTHORIZED_FOR_ZOVRO: no invitation")

          existing = call("GET", "/v1/betaTesters", {
              "filter[email]": email, "limit": "20"
          }).get("data", [])
          exact = [t for t in existing
                   if t.get("attributes", {}).get("email", "").lower() == email.lower()]
          if len(exact) > 1:
              sys.exit("DUPLICATE_MATCHING_TESTERS: no invitation")

          current = call("GET", "/v1/betaGroups/" + group_id + "/betaTesters",
                         {"limit": "200"}).get("data", [])
          current_ids = {t["id"] for t in current}
          if exact and exact[0]["id"] in current_ids:
              print("ACCOUNT_HOLDER_INVITE=ALREADY_IN_INTERNAL_GROUP")
          elif exact:
              try:
                  call("POST", "/v1/betaGroups/" + group_id + "/relationships/betaTesters",
                       body={"data": [{"type": "betaTesters", "id": exact[0]["id"]}]})
                  print("ACCOUNT_HOLDER_INVITE=EXISTING_TESTER_ADDED")
              except urllib.error.HTTPError as err:
                  if err.code != 409:
                      raise
                  print("INTERNAL_GROUP_ASSIGNMENT=REJECTED_409")
                  assigned = call("GET", "/v1/builds/" + build_id + "/individualTesters",
                                  {"limit": "200"}).get("data", [])
                  if exact[0]["id"] not in {t["id"] for t in assigned}:
                      call("POST", "/v1/builds/" + build_id + "/relationships/individualTesters",
                           body={"data": [{"type": "betaTesters", "id": exact[0]["id"]}]})
                      print("ACCOUNT_HOLDER_INVITE=INDIVIDUAL_BUILD_ASSIGNMENT_SUBMITTED")
                  else:
                      print("ACCOUNT_HOLDER_INVITE=ALREADY_IN_INDIVIDUAL_BUILD_LIST")
          else:
              attrs = {"email": email}
              for k in ("firstName", "lastName"):
                  if owner_attrs.get(k):
                      attrs[k] = owner_attrs[k]
              call("POST", "/v1/betaTesters", body={
                  "data": {
                      "type": "betaTesters",
                      "attributes": attrs,
                      "relationships": {
                          "betaGroups": {
                              "data": [{"type": "betaGroups", "id": group_id}]
                          }
                      }
                  }
              })
              print("ACCOUNT_HOLDER_INVITE=CREATED_INTERNAL_TESTER")

          current = call("GET", "/v1/betaGroups/" + group_id + "/betaTesters",
                         {"limit": "200"}).get("data", [])
          matches = [t for t in current
                     if t.get("attributes", {}).get("email", "").lower() == email.lower()]
          print("INTERNAL_GROUP_TESTER_COUNT=" + str(len(current)))
          print("OWNER_LINK_VERIFIED=" + str(len(matches) == 1))
          if matches:
              print("OWNER_TESTER_STATE=" +
                    str(matches[0].get("attributes", {}).get("state", "UNKNOWN")))
          else:
              direct_testers = call("GET", "/v1/builds/" + build_id + "/individualTesters",
                                    {"limit": "200"}).get("data", [])
              print("INDIVIDUAL_BUILD_ASSIGNMENT_VERIFIED=" + str(
                  any(t.get("attributes", {}).get("email", "").lower() == email.lower()
                      for t in direct_testers)
              ))
              if not any(t.get("attributes", {}).get("email", "").lower() == email.lower()
                         for t in direct_testers):
                  sys.exit("OWNER_INTERNAL_BUILD_ASSIGNMENT_NOT_VISIBLE")
          PY
