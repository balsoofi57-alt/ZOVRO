name: ZOVRO Home Browser Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'website-final.js'
      - 'website-final.css'
      - 'home-ux-client.js'
      - 'home-ux.css'
      - 'scripts/home-ux-browser-smoke.js'
      - '.github/workflows/home-browser-smoke.yml'

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and browser test dependency
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Test smartphone layout and navigation
        run: node scripts/home-ux-browser-smoke.js
      - name: Save mobile home screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zovro-home-mobile-preview
          path: zovro-home-mobile-preview.png
          if-no-files-found: ignore
          retention-days: 7
