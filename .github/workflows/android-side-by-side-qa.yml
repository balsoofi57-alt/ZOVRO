name: ZOVRO QA side-by-side APK (one-time)

on:
  push:
    branches: [qa/android-side-by-side-20261113]
    paths:
      - '.github/workflows/android-side-by-side-qa.yml'

permissions:
  contents: read

concurrency:
  group: zovro-android-side-by-side-20261113
  cancel-in-progress: false

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout stable ZOVRO source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Android native shell from stable source
        env:
          ZOVRO_API_URL: https://zovro-api-final.onrender.com
          ZOVRO_BUILD_CHANNEL: android-qa-side-by-side
        run: npm run mobile:init
      - name: Isolate debug package and label from production
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          gradle=Path('android/app/build.gradle')
          source=gradle.read_text()
          matches=re.findall(r'(?m)^\s*applicationId\s+["\']com\.zovro\.app["\']',source)
          if len(matches)!=1 or source.count('buildTypes {')!=1 or 'applicationIdSuffix' in source:
              raise SystemExit('Unexpected Gradle project; refusing to alter application identity')
          source=source.replace('buildTypes {','buildTypes {\n        debug { applicationIdSuffix ".qa" }',1)
          gradle.write_text(source)
          labels=Path('android/app/src/main/res/values/strings.xml')
          src=labels.read_text()
          src,n=re.subn(r'(<string\s+name="app_name"\s*>)[^<]*(</string>)',r'\g<1>ZOVRO QA\g<2>',src)
          if n!=1:
              raise SystemExit('Cannot mark QA app name unambiguously')
          labels.write_text(src)
          html=Path('www/index.html')
          page=html.read_text()
          if page.count('</body>')!=1 or 'ZOVRO QA · TEST BUILD' in page:
              raise SystemExit('Unexpected mobile HTML; aborting QA banner injection')
          banner='<script>document.addEventListener("DOMContentLoaded",()=>{const b=document.createElement("div");b.textContent="ZOVRO QA · TEST BUILD — LIVE SERVICE: USE TEST ACCOUNTS ONLY";b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#f5cc49;color:#0f223a;text-align:center;font:700 10px Arial,sans-serif;padding:4px 8px";b.setAttribute("role","status");document.body.appendChild(b)});</script>'
          html.write_text(page.replace('</body>',banner+'\n</body>'))
          print('Marked side-by-side QA package, app label and visible test banner.')
          PY
          npx cap copy android
      - name: Build installable QA debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify QA-only package and signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tools/aapt"
          test -x "$tools/apksigner"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='com.zovro.app.qa'"
          "$tools/aapt" dump badging "$apk" | grep -F "application-label:'ZOVRO QA'"
          "$tools/apksigner" verify --verbose "$apk"
          sha256sum "$apk" | tee ZOVRO-QA-Android.sha256
          echo "QA package verified. Does not replace com.zovro.app."
      - name: Preserve QA APK and digest
        uses: actions/upload-artifact@v4
        with:
          name: zovro-qa-side-by-side-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ZOVRO-QA-Android.sha256
          retention-days: 14
          if-no-files-found: error
