name: ZOVRO Verify Final 353.1 TestFlight Compliance and Internal Distribution
on:
  push:
    branches: [release/testflight-android-20261112]
    paths: ['.github/workflows/zovro-353-internal-ready-20261112.yml']
permissions:
  contents: read
jobs:
  internal-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Apple JWT support
        run: python -m pip install --quiet --disable-pip-version-check "PyJWT[crypto]==2.10.1"
      - name: Wait for Apple processing, restore prior compliance only if missing, verify internal TestFlight
        env:
          APPLE_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64,datetime,json,urllib.parse,urllib.request,urllib.error,time,sys
          import jwt
          for name in ("APPLE_KEY_ID","APPLE_ISSUER_ID","APPLE_PRIVATE_KEY_BASE64"):
              if not os.getenv(name): sys.exit("Missing Apple API credential")
          now=int(datetime.datetime.now(datetime.timezone.utc).timestamp())
          token=jwt.encode({"iss":os.environ["APPLE_ISSUER_ID"],"iat":now-30,"exp":now+900,"aud":"appstoreconnect-v1"},base64.b64decode(os.environ["APPLE_PRIVATE_KEY_BASE64"],validate=True),algorithm="ES256",headers={"kid":os.environ["APPLE_KEY_ID"],"typ":"JWT"})
          def call(method,path,params=None,data=None):
              url="https://api.appstoreconnect.apple.com"+path
              if params: url+="?"+urllib.parse.urlencode(params)
              payload=json.dumps(data,separators=(',',':')).encode() if data is not None else None
              hdr={"Authorization":"Bearer "+token,"Accept":"application/json"}
              if payload is not None: hdr["Content-Type"]="application/json"
              req=urllib.request.Request(url,headers=hdr,method=method,data=payload)
              with urllib.request.urlopen(req,timeout=45) as result:
                  b=result.read()
                  return json.loads(b) if b else {}
          apps=call("GET","/v1/apps",{"filter[bundleId]":"com.zovro.app","limit":"5"}).get("data",[])
          apps=[a for a in apps if a.get("attributes",{}).get("bundleId")=="com.zovro.app"]
          if len(apps)!=1: sys.exit("ZOVRO bundle identifier mismatch; no changes")
          app=apps[0]
          groups=call("GET","/v1/betaGroups",{"filter[app]":app["id"],"limit":"100"}).get("data",[])
          internal=[g for g in groups if g.get("attributes",{}).get("isInternalGroup") is True]
          if len(internal)!=1 or internal[0].get("attributes",{}).get("hasAccessToAllBuilds") is not True: sys.exit("Internal-only distribution configuration mismatch; no changes")
          group=internal[0]
          def builds():
              return call("GET","/v1/builds",{"filter[app]":app["id"],"sort":"-uploadedDate","limit":"25"}).get("data",[])
          def unique(items,version):
              result=[b for b in items if b.get("attributes",{}).get("version")==version]
              if len(result)!=1: return None
              return result[0]
          target=None
          for attempt in range(15):
              items=builds()
              baseline=unique(items,"351.1")
              if not baseline or baseline.get("attributes",{}).get("usesNonExemptEncryption") is not False: sys.exit("Previously confirmed compliant build 351.1 not found; no changes")
              target=unique(items,"353.1")
              state=target.get("attributes",{}).get("processingState") if target else "NOT_INDEXED"
              print("APPLE_BUILD_353_1_CHECK attempt="+str(attempt+1)+" processing="+str(state),flush=True)
              if state=="VALID": break
              if state in ("FAILED","INVALID"): sys.exit("Apple rejected build processing; no changes")
              time.sleep(20)
          else: sys.exit("Build 353.1 not VALID yet; no changes made")
          assert target
          attrs=target["attributes"]
          if attrs.get("usesNonExemptEncryption") is None:
              call("PATCH","/v1/builds/"+target["id"],data={"data":{"type":"builds","id":target["id"],"attributes":{"usesNonExemptEncryption":False}}})
              print("RESTORED_SAME_APP_PRIOR_COMPLIANCE_FOR_353_1=true",flush=True)
          elif attrs.get("usesNonExemptEncryption") is False:
              print("353_1_ALREADY_DECLARED_EXEMPT=true",flush=True)
          else: sys.exit("Conflicting encryption declaration; no changes made")
          recheck=call("GET","/v1/builds/"+target["id"]).get("data",{}).get("attributes",{})
          if recheck.get("usesNonExemptEncryption") is not False: sys.exit("Apple did not confirm compliance value")
          print("APPLE_CONFIRMED_353_1_COMPLIANCE=true",flush=True)
          for attempt in range(10):
              beta=call("GET","/v1/builds/"+target["id"]+"/buildBetaDetail").get("data",{}).get("attributes",{})
              members=call("GET","/v1/betaGroups/"+group["id"]+"/builds",{"limit":"200"}).get("data",[])
              linked=any(x.get("id")==target["id"] for x in members)
              status=beta.get("internalBuildState","UNKNOWN")
              print("INTERNAL_353_1_CHECK attempt="+str(attempt+1)+" status="+str(status)+" linked="+str(linked),flush=True)
              if status=="IN_BETA_TESTING" and linked:
                  print("FINAL_353_1_READY_FOR_EXISTING_INTERNAL_TESTERS=true",flush=True)
                  break
              if status in ("IN_BETA_REVIEW","REJECTED","EXPIRED"): sys.exit("Build not eligible for automatic internal testing")
              if attempt<9: time.sleep(20)
          else: print("FINAL_353_1_NOT_YET_LINKED_TO_INTERNAL_GROUP=true",flush=True)
          PY
