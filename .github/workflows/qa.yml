name: ZOVRO Full QA

on:
  workflow_dispatch:
  push:
    branches: [main, feature/zovro-product-expansion, store-release-prep, zovro-final-deploy, ui/final-reference-6704-20260925, ui/exact-brand-6704-20260925, ui/official-brand-asset-20260925, ui/final-locked-car-brand-20260925, ui/final-gps-wheel-lock-20260925]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'website-final.css'
      - 'website-final.js'
      - 'assets/**'
      - 'privacy.html'
      - 'terms.html'
      - 'support.html'
      - 'support-policy.js'
      - 'support-center.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'password-recovery-client.js'
      - 'payment-client.js'
      - 'payment-ui.js'
      - 'push-client.js'
      - 'live-map.js'
      - 'profile-security-client.js'
      - 'consent-client.js'
      - 'biometric-client.js'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main, zovro-final-deploy]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - 'support.html'
      - 'support-policy.js'
      - 'support-center.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'password-recovery-client.js'
      - 'payment-client.js'
      - 'payment-ui.js'
      - 'push-client.js'
      - 'live-map.js'
      - 'profile-security-client.js'
      - 'consent-client.js'
      - 'biometric-client.js'
      - '.github/workflows/*.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend
      - name: Run complete QA suite
        env:
          ZOVRO_API_URL: https://zovro-api-final.onrender.com
          ZOVRO_BUILD_CHANNEL: ci
        run: npm run qa:all
