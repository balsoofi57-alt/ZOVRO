name: ZOVRO Full QA

on:
  workflow_dispatch:
  push:
    branches: [main, feature/zovro-product-expansion, store-release-prep, zovro-final-deploy]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - 'support.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - '.github/workflows/qa.yml'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/finalize-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - 'support.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - '.github/workflows/qa.yml'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/finalize-website.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend
      - name: Run complete QA suite
        env:
          ZOVRO_API_URL: https://zovro-api-final.onrender.com
          ZOVRO_BUILD_CHANNEL: ci
        run: npm run qa:all
