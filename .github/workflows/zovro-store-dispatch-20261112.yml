name: ZOVRO Store Upload Dispatch (2026-11-12)
# Owner-requested one-time trigger. This branch does not change production app code.
on:
  push:
    branches: [release/testflight-android-20261112]
    paths: ['.github/workflows/zovro-store-dispatch-20261112.yml']
permissions:
  contents: read
  actions: write
jobs:
  request-store-uploads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request verified iOS workflow TestFlight upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"upload_testflight":"true"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ios-release.yml/dispatches"
          echo "Requested iOS TestFlight upload; separate iOS run must report success."
      - name: Request Android signed AAB and Google Play internal draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"upload_google_play":"true"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/dispatches"
          echo "Requested Android signing and Play internal draft; separate run must report success."
