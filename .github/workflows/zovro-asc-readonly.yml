name: ZOVRO Apple Connect Read-only Verification

on:
  push:
    branches: [diagnostics/asc-readonly-zovro-20261113]
    paths:
      - '.github/workflows/zovro-asc-readonly.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read ZOVRO app and build processing states without mutations
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        # Agreement recheck after prior FORBIDDEN.REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('node:crypto');
          const keyId=process.env.APP_STORE_CONNECT_API_KEY_ID||'';
          const issuerId=process.env.APP_STORE_CONNECT_ISSUER_ID||'';
          const rawKey=process.env.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64||'';
          if(!keyId||!issuerId||!rawKey)throw new Error('Missing App Store Connect API credentials');
          const privateKey=crypto.createPrivateKey(Buffer.from(rawKey,'base64').toString('utf8'));
          const encode=(v)=>Buffer.from(JSON.stringify(v)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const data=encode({alg:'ES256',kid:keyId,typ:'JWT'})+'.'+encode({iss:issuerId,iat:now,exp:now+600,aud:'appstoreconnect-v1'});
          const signature=crypto.sign('sha256',Buffer.from(data),{key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const jwt=data+'.'+signature;
          const api=async (path)=>{
            const response=await fetch('https://api.appstoreconnect.apple.com'+path,{headers:{Authorization:'Bearer '+jwt,Accept:'application/json'}});
            if(!response.ok){const failure=await response.json().catch(()=>({errors:[]}));const info=(failure.errors||[]).map(e=>({status:e.status,code:e.code,title:e.title,detail:String(e.detail||'').slice(0,240)}));console.error('App Store Connect HTTP status '+response.status,JSON.stringify(info));throw new Error('App Store Connect read failed');}
            return response.json();
          };
          (async()=>{
            const apps=await api('/v1/apps?filter%5BbundleId%5D=com.zovro.app&limit=5');
            const app=(apps.data||[]).find(x=>x.attributes?.bundleId==='com.zovro.app');
            if(!app)throw new Error('ZOVRO app was not found for authorized API key');
            console.log('Verified app:',app.attributes.bundleId,'state:',app.attributes.appStoreState||'unknown');
            const params=new URLSearchParams({'filter[app]':app.id,'limit':'40','sort':'-uploadedDate'});
            const builds=await api('/v1/builds?'+params.toString());
            const results=(builds.data||[]).map(b=>({
              build:b.attributes?.version||'unknown',
              uploaded:b.attributes?.uploadedDate||'unknown',
              processing:b.attributes?.processingState||'unknown',
              expired:b.attributes?.expired??null
            }));
            console.log('Most recent ZOVRO builds (up to 40):',JSON.stringify(results));
          })().catch(err=>{console.error('Read-only App Store Connect check failed:',err.message);process.exitCode=1});
          NODE
