name: ZOVRO App Store Connect Status Read Only
on:
  push:
    branches: [release/testflight-android-20261112]
    paths: ['.github/workflows/zovro-asc-status-20261112.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install Apple JWT support
        run: python -m pip install --quiet --disable-pip-version-check "PyJWT[crypto]==2.10.1"
      - name: Verify newest ZOVRO TestFlight build with Apple API (read only)
        env:
          APPLE_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64,datetime,json,urllib.parse,urllib.request,sys
          import jwt
          for name in ("APPLE_KEY_ID","APPLE_ISSUER_ID","APPLE_PRIVATE_KEY_BASE64"):
              if not os.getenv(name): sys.exit("Missing Apple API credential; cannot verify")
          now=int(datetime.datetime.now(datetime.timezone.utc).timestamp())
          token=jwt.encode({"iss":os.environ["APPLE_ISSUER_ID"],"iat":now-30,"exp":now+600,"aud":"appstoreconnect-v1"},base64.b64decode(os.environ["APPLE_PRIVATE_KEY_BASE64"],validate=True),algorithm="ES256",headers={"kid":os.environ["APPLE_KEY_ID"],"typ":"JWT"})
          def get(path,params=None):
              url="https://api.appstoreconnect.apple.com"+path
              if params: url+="?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=40) as response:
                  return json.load(response)
          apps=get("/v1/apps",{"filter[bundleId]":"com.zovro.app","limit":"5"}).get("data",[])
          apps=[a for a in apps if a.get("attributes",{}).get("bundleId")=="com.zovro.app"]
          if len(apps)!=1: sys.exit("ZOVRO_APP_NOT_FOUND_OR_AMBIGUOUS")
          app_id=apps[0]["id"]
          builds=get("/v1/builds",{"filter[app]":app_id,"sort":"-uploadedDate","limit":"10"}).get("data",[])
          print("RECENT_BUILD_COUNT="+str(len(builds)))
          for a in builds[:8]:
              attr=a.get("attributes",{})
              print("BUILD version="+str(attr.get("version"))+" uploaded="+str(attr.get("uploadedDate"))+" processing="+str(attr.get("processingState"))+" expired="+str(attr.get("expired")))
              try:
                  detail=get("/v1/builds/"+a["id"]+"/buildBetaDetail").get("data",{}).get("attributes",{})
                  print("INTERNAL_STATE="+str(detail.get("internalBuildState","UNKNOWN")))
              except Exception:
                  print("INTERNAL_STATE=UNAVAILABLE")
          groups=get("/v1/betaGroups",{"filter[app]":app_id,"limit":"100"}).get("data",[])
          print("INTERNAL_BETA_GROUPS="+str(sum(g.get("attributes",{}).get("isInternalGroup")==True for g in groups)))
          PY
