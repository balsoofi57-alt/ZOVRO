name: Mobile Signing Secret Check
on:
  push:
    branches:
      - ops/mobile-signing-secret-check-20260926
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing credential presence only
        env:
          A1: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_BASE64 }}
          A2: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_PASSWORD }}
          A3: ${{ secrets.ZOVRO_ANDROID_KEY_ALIAS }}
          A4: ${{ secrets.ZOVRO_ANDROID_KEY_PASSWORD }}
          I1: ${{ secrets.ZOVRO_IOS_CERTIFICATE_P12_BASE64 }}
          I2: ${{ secrets.ZOVRO_IOS_CERTIFICATE_PASSWORD }}
          I3: ${{ secrets.ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 }}
          I4: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
          I5: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          I6: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          I7: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          ok(){ test -n "$2" && echo "$1=true" || echo "$1=false"; }
          ok ANDROID_KEYSTORE "$A1"
          ok ANDROID_STORE_PASSWORD "$A2"
          ok ANDROID_KEY_ALIAS "$A3"
          ok ANDROID_KEY_PASSWORD "$A4"
          ok IOS_CERTIFICATE "$I1"
          ok IOS_CERTIFICATE_PASSWORD "$I2"
          ok IOS_PROFILE "$I3"
          ok APPLE_TEAM_ID "$I4"
          ok ASC_KEY_ID "$I5"
          ok ASC_ISSUER_ID "$I6"
          ok ASC_PRIVATE_KEY "$I7"
