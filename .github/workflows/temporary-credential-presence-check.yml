name: Temporary Credential Presence Check

on:
  push:
    branches: [zovro-final-deploy]
    paths:
      - '.github/workflows/temporary-credential-presence-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      IOS_P12: ${{ secrets.ZOVRO_IOS_CERTIFICATE_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.ZOVRO_IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE: ${{ secrets.ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM: ${{ secrets.ZOVRO_APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
      ANDROID_KEYSTORE: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_ALIAS: ${{ secrets.ZOVRO_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1" value="$2"
            if [[ -n "$value" ]]; then
              echo "$label=PRESENT"
            else
              echo "$label=MISSING"
            fi
          }
          check ZOVRO_IOS_CERTIFICATE_P12_BASE64 "$IOS_P12"
          check ZOVRO_IOS_CERTIFICATE_PASSWORD "$IOS_P12_PASSWORD"
          check ZOVRO_IOS_PROVISIONING_PROFILE_BASE64 "$IOS_PROFILE"
          check ZOVRO_APPLE_TEAM_ID "$APPLE_TEAM"
          check ZOVRO_APP_STORE_CONNECT_API_KEY_ID "$ASC_KEY_ID"
          check ZOVRO_APP_STORE_CONNECT_ISSUER_ID "$ASC_ISSUER"
          check ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 "$ASC_PRIVATE_KEY"
          check ZOVRO_ANDROID_KEYSTORE_BASE64 "$ANDROID_KEYSTORE"
          check ZOVRO_ANDROID_KEYSTORE_PASSWORD "$ANDROID_STORE_PASSWORD"
          check ZOVRO_ANDROID_KEY_ALIAS "$ANDROID_ALIAS"
          check ZOVRO_ANDROID_KEY_PASSWORD "$ANDROID_KEY_PASSWORD"
