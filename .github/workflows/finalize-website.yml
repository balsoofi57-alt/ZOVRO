name: Finalize ZOVRO Website
on:
  push:
    branches: [main]
    paths:
      - 'website-final.css'
      - 'website-final.js'
      - 'scripts/apply-website-final.js'
      - '.github/workflows/finalize-website.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[website-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final website assets
        run: node scripts/apply-website-final.js
      - name: Verify website integration
        run: |
          grep -q 'website-final.css' index.html
          grep -q 'website-final.js' index.html
          grep -q 'Anywhere, Anytime, Near to You.' website-final.js
          grep -q 'support@zovro.net' website-final.js
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply final ZOVRO website experience [website-finalized]'
          git push origin HEAD:main
