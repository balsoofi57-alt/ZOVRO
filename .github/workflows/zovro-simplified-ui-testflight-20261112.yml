name: ZOVRO Simplified UI TestFlight Dispatch
on:
  push:
    branches: [release/testflight-android-20261112]
    paths: ['.github/workflows/zovro-simplified-ui-testflight-20261112.yml']
permissions:
  contents: read
  actions: write
jobs:
  request-testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger signed iPhone TestFlight build for current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"upload_testflight":"true"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ios-release.yml/dispatches"
          echo "iOS dispatch accepted; the actual upload is verified in the separate workflow."

