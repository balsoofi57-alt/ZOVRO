name: ZOVRO Easy Internal Updates

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build for iPhone, Android, or both
        required: true
        type: choice
        options:
          - ios
          - android
          - both
        default: ios
      upload_to_internal:
        description: Upload to TestFlight / create Google Play internal draft (requires valid credentials and agreements)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: zovro-easy-internal-update-${ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-dispatch:
    name: Validate prerequisites and start release jobs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Apple agreements and API access before building
        if: ${{ inputs.upload_to_internal == true && (inputs.platform == 'ios' || inputs.platform == 'both') }}
        env:
          ZOVRO_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          ZOVRO_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: node scripts/apple-release-preflight.js

      - uses: actions/setup-java@v4
        if: ${{ inputs.upload_to_internal == true && (inputs.platform == 'android' || inputs.platform == 'both') }}
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android Play upload signing before building
        if: ${{ inputs.upload_to_internal == true && (inputs.platform == 'android' || inputs.platform == 'both') }}
        shell: bash
        env:
          ZOVRO_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_BASE64 }}
          ZOVRO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_PASSWORD }}
          ZOVRO_ANDROID_KEY_ALIAS: ${{ secrets.ZOVRO_ANDROID_KEY_ALIAS }}
          ZOVRO_ANDROID_KEY_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEY_PASSWORD }}
          ZOVRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ZOVRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for name in ZOVRO_ANDROID_KEYSTORE_BASE64 ZOVRO_ANDROID_KEYSTORE_PASSWORD ZOVRO_ANDROID_KEY_ALIAS ZOVRO_ANDROID_KEY_PASSWORD ZOVRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::ANDROID_SIGNING_MISSING: $name. Configure this GitHub Actions secret before uploading."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/zovro-upload-check.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ZOVRO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ZOVRO_ANDROID_KEYSTORE_PASSWORD" -alias "$ZOVRO_ANDROID_KEY_ALIAS" >/dev/null || {
            echo "::error::ANDROID_SIGNING_INVALID: Upload keystore, alias, or password is invalid."
            exit 1
          }
          node <<'NODE'
          try {
            const json = JSON.parse(process.env.ZOVRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON);
            if (json.type !== 'service_account' || !json.client_email || !json.private_key) {
              throw new Error('not a service account');
            }
          } catch {
            console.error('::error::GOOGLE_PLAY_API_CREDENTIALS_INVALID: service account JSON is missing or invalid.');
            process.exit(1);
          }
          NODE
          echo "::notice::Android signing credentials are present. The store will still validate the upload key."

      - name: Start selected ZOVRO release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          ZOVRO_RELEASE_PLATFORM: ${{ inputs.platform }}
          ZOVRO_RELEASE_UPLOAD: ${{ inputs.upload_to_internal }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/dispatch-internal-update.js
