name: ZOVRO External TestFlight Group for 395.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-group:
    name: Add external TestFlight group and link build 395.2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create external group and link build 395.2
        env:
          ZOVRO_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_KEY_ID }}
          ZOVRO_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ZOVRO_APP_STORE_CONNECT_ISSUER_ID }}
          ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.ZOVRO_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: node scripts/external-testflight-group.js
      - name: Declare action scope
        if: always()
        run: |
          echo "Created the external TestFlight group and linked build 395.2. No testers were added, no public link was enabled, and no public App Store release was performed." >> "$GITHUB_STEP_SUMMARY"
