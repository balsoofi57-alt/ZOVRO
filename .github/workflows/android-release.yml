name: ZOVRO Android Release Verification

on:
  workflow_dispatch:
  push:
    branches: [main, store-release-prep, zovro-final-deploy]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare current mobile bundle
        env:
          ZOVRO_API_URL: https://zovro-api-final.onrender.com
          ZOVRO_BUILD_CHANNEL: release
        run: node scripts/prepare-mobile.js
      - name: Create and sync Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-native.js
      - name: Build debug APK and unsigned release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Prepare optional Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ZOVRO_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Android signing secrets are incomplete; keeping the verified unsigned release artifact."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/zovro-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            echo "available=true"
            echo "keystore_path=$KEYSTORE_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ZOVRO_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ZOVRO_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/app-release.aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zovro-android-release-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
