<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>ZOVRO · Request administration</title><link rel="stylesheet" href="website-final.css?v=11"><style>body{margin:0}.admin-wrap{max-width:950px;margin:auto;padding:24px 18px 70px}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.admin-head img{width:140px;height:72px;object-fit:contain}.admin-tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.admin-tools input{flex:1;min-width:180px;padding:14px;background:#1d2531;color:#fff;border:1px solid #69717f;border-radius:12px;font:inherit}button{cursor:pointer}.admin-row{margin:12px 0;display:flex;justify-content:space-between;gap:18px;align-items:center}.admin-row p{margin:6px 0}.admin-row small{overflow-wrap:anywhere}.admin-detail{margin-top:24px;overflow-wrap:anywhere}.admin-detail dt{color:#b8bcc5;margin-top:16px}.admin-detail dd{margin:5px 0;font-weight:600}.admin-status{line-height:1.6}[hidden]{display:none!important}@media(max-width:500px){.admin-row{align-items:flex-start;flex-direction:column}.admin-row button{width:100%}}</style></head><body><main class="admin-wrap"><header class="admin-head"><img src="assets/zovro-official-brand.webp" alt="ZOVRO"><a href="./">Back to ZOVRO</a></header><h1>Request administration</h1><p>Inspect the location submitted with a customer request. Administrator access is required.</p><p id="adminStatus" class="admin-status" role="status" aria-live="polite">Checking your access…</p><div class="admin-actions"><button id="adminRetry" class="btn ghost" type="button">Check access again</button><a class="btn ghost" href="./index.html#support">Account support</a></div><form id="adminLogin" class="card" hidden><h2>Administrator sign in</h2><p>Use the phone number and password registered with your ZOVRO account.</p><div class="field"><label for="adminPhone">Phone number</label><input id="adminPhone" type="tel" autocomplete="username" required></div><div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required><button id="adminShowPassword" class="btn ghost" type="button" aria-pressed="false">Show password</button></div><button id="adminLoginSubmit" class="btn primary" type="submit">Sign in</button><p><a href="./">Account help</a></p></form><form id="adminSearch" class="admin-tools" hidden><input id="adminRequestId" aria-label="Request ID" placeholder="Exact request ID, or leave blank for recent requests" maxlength="120"><button class="btn primary" type="submit">Find requests</button></form><div id="adminRequests"></div><button id="adminMore" class="btn ghost" hidden>Load more</button><section id="adminDetail" class="card admin-detail" hidden aria-label="Request details"></section></main><script src="admin-requests-client.js?v=4"></script></body></html>
